# Workflow reutilizable: autoría de los commits de un PR (GOVERNANCE, regla 8).
#
# Uso en un repo (el job entra en los `needs` de `ci-ok`):
#
#   autoria:
#     if: github.event_name == 'pull_request'
#     uses: ELYOS-Racing/.github/.github/workflows/autoria.yml@main
#
# Falla si algún commit del PR (sin contar merges ni bots):
#   1. no trae `Signed-off-by` (DCO) con el correo de su autor o de quien lo commiteó;
#   2. trae un `Co-authored-by` de una herramienta de IA;
#   3. trae un `Co-authored-by` de alguien que no firmó ningún commit del PR (gente de fuera).
# Los `Co-authored-by` que GitHub agrega al hacer squash de un PR con varios autores pasan, porque esas personas
# firmaron sus propios commits en el mismo PR.
name: Autoría

on:
  workflow_call:

permissions:
  contents: read

jobs:
  autoria:
    name: dco y coautoría
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Revisar los commits del PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # correos y nombres de herramientas de IA que se acreditan como coautoras
          IA='anthropic|claude|openai|chatgpt|copilot|cursor|codeium|windsurf|devin|gemini|tabnine|aider|codex'
          commits=$(git rev-list --no-merges "$BASE..$HEAD")
          [ -n "$commits" ] || { echo "Sin commits que revisar"; exit 0; }
          lower() { tr '[:upper:]' '[:lower:]'; }
          firmantes=$(for c in $commits; do
            git show -s --format=%B "$c" | grep -iE '^Signed-off-by:' | grep -oE '<[^>]+>' | tr -d '<>' || true
          done | lower | sort -u)
          errores=0
          for c in $commits; do
            corto=$(git rev-parse --short "$c")
            autor=$(git show -s --format='%an <%ae>' "$c")
            correos=$(git show -s --format='%ae%n%ce' "$c" | lower)
            msg=$(git show -s --format=%B "$c")
            if printf '%s' "$autor" | grep -qE '\[bot\]'; then continue; fi
            firmas=$(printf '%s\n' "$msg" | grep -iE '^Signed-off-by:' | grep -oE '<[^>]+>' | tr -d '<>' | lower || true)
            if ! printf '%s\n' "$firmas" | grep -qxFf <(printf '%s\n' "$correos"); then
              echo "::error::$corto ($autor) no trae Signed-off-by con su correo. Corrígelo con: git commit --amend -s (o git rebase --signoff)"
              errores=1
            fi
            while IFS= read -r linea; do
              [ -n "$linea" ] || continue
              correo=$(printf '%s' "$linea" | grep -oE '<[^>]+>' | tr -d '<>' | lower || true)
              if printf '%s' "$linea" | lower | grep -qE "$IA"; then
                echo "::error::$corto acredita a una herramienta de IA como coautora: «$linea». Se puede usar IA, pero no se acredita (regla 8): quita la línea"
                errores=1
              elif ! printf '%s\n' "$firmantes" | grep -qxF "$correo"; then
                echo "::error::$corto tiene un coautor que no firmó ningún commit del PR: «$linea». Quien aporta hace sus propios commits con -s (regla 8)"
                errores=1
              fi
            done < <(printf '%s\n' "$msg" | grep -iE '^Co-authored-by:' || true)
          done
          [ "$errores" = 0 ] && echo "OK: $(echo "$commits" | wc -l) commits con DCO y sin coautores externos ni de IA"
          exit "$errores"
